description: "The OpenSSH package contains ssh clients and the sshd daemon."

package:
  name: openssh
  version: 10.3p1
  rel: 1
  archive: false
  delete: true

sources:
  - url: https://ftp.openbsd.org/pub/OpenBSD/OpenSSH/portable/openssh-10.3p1.tar.gz
    sha256: 56682a36bb92dcf4b4f016fd8ec8e74059b79a8de25c15d670d731e7d18e45f4
    md5:

prepare: |
  install -v -g sys -m700 -d /var/lib/sshd;
  groupadd -g 50 sshd;
  useradd -c 'sshd PrivSep' -d /var/lib/sshd -g sshd -s /bin/false -u 50 sshd;
  ./configure --prefix=/usr --sysconfdir=/etc/ssh --with-privsep-path=/var/lib/sshd \
    --with-default-path=/usr/bin --with-superuser-path=/usr/sbin:/usr/bin --with-pid-dir=/run

build: |
  make

install: |
  make install

final: |
  install -v -m755 contrib/ssh-copy-id /usr/bin &&
  install -v -m644 contrib/ssh-copy-id.1 /usr/share/man/man1 &&
  install -v -m755 -d /usr/share/doc/openssh-${PKGVER} &&
  install -v -m644 INSTALL LICENCE OVERVIEW README* /usr/share/doc/openssh-${PKGVER}

optional:
  - which
  - gdb
  - linux-pam
  - shadow-pam
  - mitkrb5
  - net-tools
  - sysstat

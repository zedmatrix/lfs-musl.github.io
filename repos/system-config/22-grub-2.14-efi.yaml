description: "GRand Unified Bootloader built with UEFI support."

package:
  name: grub-efi
  version: 2.14
  rel: 1
  archive: false
  delete: true
  cflags: " "

sources:
  - url: https://mirror.csclub.uwaterloo.ca/gnu/grub/grub-2.14.tar.xz
    sha256: bc8d3c73535b8838d8c8e2654d73edc4e6ae8c8acdb45d5df5dc9a1547446d43
    md5: 383f9effad01c235d2535357ff717543
  - url: https://unifoundry.com/pub/unifont/unifont-17.0.01/font-builds/unifont-17.0.01.pcf.gz
    sha256: 8240c381398a21f4eef993d16f0976d6a627e61054f0add275d195408f24efa9
    md5: c3fbc239da0fb49a9afc9b141f606ad4
  - url: https://downloads.sourceforge.net/project/dejavu/dejavu/2.37/dejavu-fonts-ttf-2.37.tar.bz2
    sha256: fa9ca4d13871dd122f61258a80d01751d603b4d3ee14095d65453b4e846e17d7
    md5:

prepare: |
  gunzip -c ${YSRC}/unifont-17.0.01.pcf.gz > unifont.pcf;
  tar xf ${YSRC}/dejavu-fonts-ttf-2.37.tar.bz2 --strip-components=2 --wildcards *.ttf;
  sed 's/--image-base/--nonexist-linker-option/' -i configure;
  echo depends bli part_gpt > grub-core/extra_deps.lst

build: |
  ./configure --prefix=/usr --sysconfdir=/etc --enable-grub-themes \
    --disable-efiemu --with-platform=efi --target=x86_64 --disable-werror &&
  make

install: |
  make install;
  install -vm755 grub-mkfont /usr/bin/;
  install -vm644 ascii.h widthspec.h *.pf2 /usr/share/grub/;
  install -vm755 grub-mount /usr/bin/

required:
  - freetype2
  - fuse3
  - lvm2
  - efibootmgr

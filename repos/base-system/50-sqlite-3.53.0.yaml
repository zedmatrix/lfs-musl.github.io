description: "The Sqlite package is a software library that implements a self-contained, serverless, zero-configuration, transactional SQL database engine."

package:
  name: sqlite
  version: 3.53.0
  rel: 1
  archive: false
  delete: true

sources:
  - url: https://sqlite.org/2026/sqlite-autoconf-3530000.tar.gz
    sha256: 851e9b38192fe2ceaa65e0baa665e7fa06230c3d9bd1a6a9662d02380d73365a
    md5:
  - url: https://anduin.linuxfromscratch.org/LFS/sqlite-doc-3530000.tar.xz
    sha256: f5dd977fba99b0165e76cc8dc0f702fa9ef08f763d3b05a5cf3459eae037650b
    md5:

prepare: |
  ./configure --prefix=/usr --disable-static --enable-fts{4,5} \
    CPPFLAGS="-D SQLITE_ENABLE_COLUMN_METADATA=1 -D SQLITE_ENABLE_UNLOCK_NOTIFY=1 \
              -D SQLITE_ENABLE_DBSTAT_VTAB=1 -D SQLITE_SECURE_DELETE=1"

build: |
  make LDFLAGS.rpath=""

install: |
  make install

final: |
  tar -xf ${YSRC}/sqlite-doc-3530000.tar.xz;
  install -v -m755 -d /usr/share/doc/sqlite-${PKGVER};
  cp -v -R sqlite-doc-3530000/* /usr/share/doc/sqlite-${PKGVER}

required:
  - musl
  - readline
  - zlib
  - tcl
  - ncurses

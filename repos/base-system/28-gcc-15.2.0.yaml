description: "The GCC package contains the GNU compiler collection which includes the C and C++ compilers."

package:
  name: gcc
  version: 15.2.0
  rel: 1
  archive: false
  delete: true

sources:
  - url: https://mirror.csclub.uwaterloo.ca/gnu/gcc/gcc-15.2.0/gcc-15.2.0.tar.xz
    sha256: 438fd996826b0c82485a29da03a72d71d6e3541a83ec702df4271f6fe025d24e
    md5: b861b092bf1af683c46a8aa2e689a6fd

prepare: |
  sed -i 's/char [*]q/const &/' libgomp/affinity-fmt.c;
  case $(uname -m) in
    x86_64)
      sed -e '/m64=/s/lib64/lib/' -i.orig gcc/config/i386/t-linux64
    ;;
  esac
  mkdir -v build && cd build &&
  ../configure --prefix=/usr LD=ld --enable-languages=c,c++ \
    --enable-default-pie --enable-default-ssp --enable-host-pie \
    --disable-multilib --disable-bootstrap --disable-fixincludes \
    --with-system-zlib --with-pkgversion="Betelgeuse ${PKGVER}"

build: |
  cd build && make

check: |
  cd build &&
  ulimit -s -H unlimited;
  sed -e '/cpython/d' -i ../gcc/testsuite/gcc.dg/plugin/plugin.exp;
  chown -R tester .;
  su tester -c "PATH=$PATH make -k check";
  ../contrib/test_summary;
  chown -v -R root:root /usr/lib/gcc/$(gcc -dumpmachine)/15.2.0/include{,-fixed}

install: |
  cd build && make install;
  ${YPKG}/gcc-testsuite.sh

final: |
  cd build &&
  ln -svr /usr/bin/cpp /usr/lib;
  ln -sv gcc.1 /usr/share/man/man1/cc.1;
  ln -sfv ../../libexec/gcc/$(gcc -dumpmachine)/15.2.0/liblto_plugin.so /usr/lib/bfd-plugins/;
  mkdir -pv /usr/share/gdb/auto-load/usr/lib;
  mv -v /usr/lib/*gdb.py /usr/share/gdb/auto-load/usr/lib

required:
  - binutils
  - gmp
  - mpfr
  - mpc
  - acl
  - attr
  - zlib
  - zstd
  - musl

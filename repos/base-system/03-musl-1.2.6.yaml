description: "The Musl Package contains an alternative main C library."

package:
  name: musl
  version: 1.2.6
  rel: 1
  archive: false
  delete: true

sources:
  - url: https://musl.libc.org/releases/musl-1.2.6.tar.gz
    sha256: d585fd3b613c66151fc3249e8ed44f77020cb5e6c1e635a616d3f9f82460512a
    md5:

patches:
  - url: sources/musl-1.2.6-cve-2026-40200.patch
    sha256: 1ee29f64f9ca8e8ad7c349779d661ff6b52126a27575d3586981357a52c406fb
    md5:
  - url: sources/musl-1.2.6-cve-2026-6042.patch
    sha256: 1d0be2e72b9d5bd16546b923aa8af861d271322f01644716a81823bec4065c99
    md5:
  - url: https://trak4.com/musl-from-scratch/musl-packages/musl-1.2.6-rpmalloc.patch
    sha256: 3240f67b6049a6eaa7a42b18d9a3d447f74649acb8defb4d369ded997fd7b11f
    md5: 57e25622ef642b5564952cd52194e501

prepare: |
  ./configure --prefix=/usr --enable-debug --with-malloc=rpmalloc

build: |
  make

install: |
  make install

final: |
  install -vm644 ${YPKG}/nsswitch-sysv.conf /etc/nsswitch.conf;
  install -vm644 ${YPKG}/ld-musl-x86_64.path /etc/ld-musl-x86_64.path;
  ln -sfv ../lib/ld-musl-x86_64.so.1 /usr/bin/ldd

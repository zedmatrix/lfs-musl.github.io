description: "The Xz package contains programs for compressing and decompressing files. It provides capabilities for the lzma and the newer xz compression formats.  Compressing text files with xz yields a better compression percentage than with the traditional gzip or bzip2 commands."

package:
  name: xz
  version: 5.8.3
  rel: 1
  archive: false
  delete: true

sources:
  - url: https://github.com//tukaani-project/xz/releases/download/v5.8.3/xz-5.8.3.tar.xz
    sha256: fff1ffcf2b0da84d308a14de513a1aa23d4e9aa3464d17e64b9714bfdd0bbfb6
    md5:

prepare: |
  ./configure --prefix=/usr --disable-static --docdir=/usr/share/doc/xz-${PKGVER}

build: |
  make

check: |
  make check || true

install: |
  make install

required:
  - bash-temp
  - binutils-pass2
  - coreutils-temp
  - diffutils-temp
  - gcc-pass2
  - musl
  - make-temp

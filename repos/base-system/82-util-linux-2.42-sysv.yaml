description: "Package contains utilities for handling file systems, consoles, partitions, and messages."

package:
  name: util-linux
  version: 2.42
  rel: 1
  archive: false
  delete: true

sources:
  - url: https://www.kernel.org/pub/linux/utils/util-linux/v2.42/util-linux-2.42.tar.xz
    sha256: 3452b260bbaa775d6e749ac3bb22111785003fc1f444970025c8da26dfa758e9
    md5:
patches:
  - url: sources/util-linux-2.42-nsenter-fix.patch
    sha256: 06da2ff7238d93359e7508afc173bc74b85d0ce3f66d9f4c7b70d33d0292e716
    md5:
    libc: musl

prepare: |
  ./configure --bindir=/usr/bin --libdir=/usr/lib --runstatedir=/run --sbindir=/usr/sbin \
    --disable-chfn-chsh --disable-login --disable-nologin --disable-su --disable-setpriv \
    --disable-runuser --disable-pylibmount --disable-liblastlog2 --disable-static --without-python \
    ADJTIME_PATH=/var/lib/hwclock/adjtime --docdir=/usr/share/doc/util-linux-${PKGVER} \
    --without-systemd --without-systemdsystemunitdir

build: |
  make

check: |
  touch /etc/fstab;
  chown -R tester .;
  su tester -c "make -k check" || true

install: |
  make install

required:
  - bash
  - binutils
  - coreutils
  - diffutils
  - file
  - findutils
  - gawk
  - gcc
  - gettext
  - musl
  - grep
  - make
  - ncurses
  - pkgconf
  - sed
  - udev
  - zlib

description: "The Bash package contains the Bourne-Again Shell."

package:
  name: bash
  version: 5.3.9
  rel: 1
  archive: false
  delete: true

sources:
  - url: sources/bash-5.3.9.tar.xz
    sha256: 64ecefd4240570d58d5dfab6d9b7921da9f2084bfd357926d2b3848d272ad558
    md5:

prepare: |
  ./configure --prefix=/usr --with-curses --without-bash-malloc \
    --with-installed-readline --docdir=/usr/share/doc/bash-${PKGVER}

build: |
  make

check: |
  chown -R tester .;
  LC_ALL=C.UTF-8 su -s /usr/bin/expect tester << "EOF";
  set timeout -1;
  spawn make tests;
  expect eof;
  lassign [wait] _ _ _ value;
  exit $value;
  EOF

install: |
  make install

required:
  - ncurses
  - readline
  - musl

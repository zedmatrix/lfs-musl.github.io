description: "Package contains programs for producing shell scripts that can automatically configure source code."

package:
  name: autoconf
  version: 2.73
  rel: 1
  archive: false
  delete: true

sources:
  - url: https://mirror.csclub.uwaterloo.ca/gnu/autoconf/autoconf-2.73.tar.xz
    sha256: 9fd672b1c8425fac2fa67fa0477b990987268b90ff36d5f016dae57be0d6b52e
    md5:

prepare: |
  ./configure --prefix=/usr

build: |
  make

check: |
  make check || true

install: |
  make install

required:
  - bash
  - coreutils-temp
  - gawk-temp
  - grep
  - m4
  - make-temp
  - perl
  - sed-temp
  - texinfo-temp

description: "The Linux Kernel"

package:
  name: linux
  version: 7.0.3
  rel: 1
  archive: false
  delete: false

sources:
  - url: https://cdn.kernel.org/pub/linux/kernel/v7.x/linux-7.0.3.tar.xz
    sha256: 0bedadbf5788693ddebbcc913c893f1a97349af79ddde7144c2a80b401959f1c
    md5:

prepare: |
  make mrproper;
  zcat /proc/config.gz > .config;
  make olddefconfig

build: |
  make;
  make modules_install

install: |
  cp -iv arch/x86/boot/bzImage /boot/vmlinuz-${PKGVER}-zlfs;
  cp -iv System.map /boot/System.map-${PKGVER};
  cp -iv .config /boot/config-${PKGVER}
